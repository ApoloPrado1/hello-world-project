---
# windows-base — baseline settings common to all Windows hosts and guests.

- name: Set timezone
  community.windows.win_timezone:
    timezone: "{{ win_base_timezone }}"

- name: Configure NTP time source
  ansible.windows.win_shell: |
    w32tm /config /manualpeerlist:"{{ win_base_ntp_servers | join(' ') }}" /syncfromflags:manual /update
    Restart-Service w32time
    w32tm /resync
  changed_when: false

- name: Set DNS servers on the primary interface
  ansible.windows.win_dns_client:
    adapter_names:
      - "{{ win_base_dns_interface }}"
    dns_servers: "{{ win_base_dns_servers }}"
  when: win_base_dns_servers | length > 0

- name: Enable Remote Desktop
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword
  when: win_base_enable_rdp | bool

- name: Allow Remote Desktop through the firewall
  ansible.windows.win_shell: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
  changed_when: false
  when: win_base_enable_rdp | bool

- name: Allow inbound ICMP (ping) for lab connectivity tests
  ansible.windows.win_shell: |
    if (-not (Get-NetFirewallRule -Name 'Allow-ICMPv4-In' -ErrorAction SilentlyContinue)) {
      New-NetFirewallRule -Name 'Allow-ICMPv4-In' -DisplayName 'Allow ICMPv4-In' `
        -Protocol ICMPv4 -IcmpType 8 -Direction Inbound -Action Allow | Out-Null
    }
  changed_when: false
  when: win_base_allow_icmp | bool
