---
# Phase 3 — finalise the DC after promotion.

# Time sync must come from w32time/NTP, not the hypervisor.
# - Hyper-V guests: the host disables the "Time Synchronization" integration
#   service (see the hyperv role).
# - ESXi-direct VMs (current interim setup): disable VMware Tools time sync here.
- name: Disable VMware Tools time sync (only if VMware Tools is present)
  ansible.windows.win_shell: |
    $cmd = 'C:\Program Files\VMware\VMware Tools\VMwareToolboxCmd.exe'
    if (Test-Path $cmd) { & $cmd timesync disable }
  changed_when: false
  when: ad_disable_vmware_timesync | bool

- name: Configure Windows Time as a reliable/manual source with NTP peers
  ansible.windows.win_shell: |
    w32tm /config /manualpeerlist:"{{ ad_ntp_peers | join(' ') }}" /syncfromflags:manual /reliable:yes /update
    Restart-Service w32time
    w32tm /resync /rediscover
  changed_when: false
  when: ad_configure_ntp | bool

- name: Quick validation — confirm the DC is advertising
  ansible.windows.win_shell: |
    $dc = Get-ADDomainController -Server localhost -ErrorAction Stop
    dcdiag /test:Advertising /q
    "OK: {0} in {1}" -f $dc.HostName, $dc.Domain
  register: ad_validation
  changed_when: false

- name: Show validation result
  ansible.builtin.debug:
    var: ad_validation.stdout_lines
