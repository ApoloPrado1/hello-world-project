---
# Phase 3 — finalise the DC after promotion.

# Time sync must come from w32time/NTP, not the hypervisor.
# - Hyper-V guests: the host disables the "Time Synchronization" integration
#   service (see the hyperv role).
# - ESXi-direct VMs (current interim setup): disable VMware Tools time sync here.
- name: Disable VMware Tools time sync (registry method, only if VMware Tools present)
  ansible.windows.win_shell: |
    if (Get-Service -Name 'VMTools' -ErrorAction SilentlyContinue) {
      New-Item -Path 'HKLM:\SOFTWARE\VMware, Inc.\VMware Tools' -Force | Out-Null
      New-ItemProperty -Path 'HKLM:\SOFTWARE\VMware, Inc.\VMware Tools' -Name 'DisableTimeSync' -Value 1 -PropertyType DWord -Force | Out-Null
      Restart-Service -Name 'VMTools' -ErrorAction SilentlyContinue
    }
  changed_when: false
  when: ad_disable_vmware_timesync | bool

# Forest root (PDC emulator) is the authoritative clock -> external NTP, reliable.
- name: Configure Windows Time — forest root uses external NTP (reliable)
  ansible.windows.win_shell: |
    w32tm /config /manualpeerlist:"{{ ad_ntp_peers | join(' ') }}" /syncfromflags:manual /reliable:yes /update
    Restart-Service w32time
    w32tm /resync /rediscover
  changed_when: false
  when:
    - ad_configure_ntp | bool
    - ad_is_forest_root | bool

# Additional DCs take time from the domain hierarchy, not external NTP.
- name: Configure Windows Time — additional DC syncs from the domain hierarchy
  ansible.windows.win_shell: |
    w32tm /config /syncfromflags:domhier /reliable:no /update
    Restart-Service w32time
    w32tm /resync /rediscover
  changed_when: false
  when:
    - ad_configure_ntp | bool
    - not (ad_is_forest_root | bool)

- name: Quick validation — confirm the DC is advertising
  ansible.windows.win_shell: |
    $dc = Get-ADDomainController -Server localhost -ErrorAction Stop
    dcdiag /test:Advertising /q
    "OK: {0} in {1}" -f $dc.HostName, $dc.Domain
  register: ad_validation
  changed_when: false

- name: Show validation result
  ansible.builtin.debug:
    var: ad_validation.stdout_lines
