---
# Phase 1 (tail) — install AD roles and apply server-role tweaks.
# (Static IP / DNS / rename are handled by the windows-base role beforehand.)

- name: Install AD DS, DNS, GPMC and management tools
  ansible.windows.win_feature:
    name: "{{ ad_features }}"
    include_management_tools: true
    state: present
  register: ad_features_result

- name: Reboot if feature installation requires it
  ansible.windows.win_reboot:
  when: ad_features_result.reboot_required

- name: Disable "Server Manager opens at logon" — machine policy (all users)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\ServerManager
    name: DoNotOpenServerManagerAtLogon
    data: 1
    type: dword

- name: Disable "Server Manager opens at logon" — scheduled task
  ansible.windows.win_shell: |
    Disable-ScheduledTask -TaskName 'ServerManager' -TaskPath '\Microsoft\Windows\Server Manager\' -ErrorAction SilentlyContinue | Out-Null
  changed_when: false
