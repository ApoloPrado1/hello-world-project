---
# active-directory — orchestrates the three former manual phases:
#   Phase 1 (features/baseline)  -> features.yml   (+ windows-base runs first)
#   Phase 2 (create/join forest) -> promote.yml
#   Phase 3 (finalise DC)        -> finalize.yml

- name: Fail early if the DSRM (safe-mode) password is not provided
  ansible.builtin.assert:
    that:
      - ad_safe_mode_password is defined
      - ad_safe_mode_password | length > 0
    fail_msg: >-
      ad_safe_mode_password must be set (encrypted vault variable, e.g.
      group_vars/domain_controllers/vault.yml).

- ansible.builtin.import_tasks: features.yml
- ansible.builtin.import_tasks: promote.yml
- ansible.builtin.import_tasks: finalize.yml
