---
# Ansible collections required by this project.
# Install with:  ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.windows        # win_feature, win_powershell, win_reboot, win_dns_client, win_ping
    version: ">=2.0.0"
  - name: community.windows      # win_timezone, win_rdp helpers
    version: ">=2.0.0"
  - name: microsoft.ad           # domain / forest promotion, domain join
    version: ">=1.5.0"
  - name: cisco.ios              # Cisco switch configuration (later)
    version: ">=5.0.0"
  - name: fortinet.fortios       # FortiGate configuration (later)
    version: ">=2.3.0"
