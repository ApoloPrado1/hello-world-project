---
# Connection settings for Cisco switches (SSH / network_cli).
# Store credentials in an encrypted vault file.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_user: "{{ vault_cisco_user }}"
ansible_password: "{{ vault_cisco_password }}"
