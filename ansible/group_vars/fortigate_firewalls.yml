---
# Connection settings for FortiGate firewalls (HTTPS API via fortios httpapi).
ansible_connection: httpapi
ansible_network_os: fortinet.fortios.fortios
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false      # lab; use a real cert in production
ansible_httpapi_port: 443
ansible_user: "{{ vault_fgt_user }}"
ansible_password: "{{ vault_fgt_password }}"
